name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.package_version.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Read package version
        id: package_version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          version = tomllib.loads(pyproject.read_text(encoding="utf-8"))["project"]["version"]
          print(f"version={version}")
          PY

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="${{ steps.package_version.outputs.version }}"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match pyproject.toml version ($PACKAGE_VERSION)." >&2
            exit 1
          fi

      - name: Build source and wheel distributions
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/praecentor/
    permissions:
      id-token: write

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      - name: Fail fast if version already exists on PyPI
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          package = "praecentor"
          version = os.environ["PACKAGE_VERSION"]

          with urllib.request.urlopen(f"https://pypi.org/pypi/{package}/json", timeout=30) as resp:
              data = json.load(resp)

          releases = data.get("releases", {})
          files = releases.get(version, [])
          if files:
              print(
                  f"PyPI already has release {package}=={version}. "
                  "Bump the version and publish a new tag instead.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Version {version} is not currently published on PyPI.")
          PY

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
